name = "alarmas-de-sumis"
compatibility_date = "2025-01-01"
keep_vars = true

# Página de alertas de suministros de la Secretaría de Salud. Sirve ./public
# como assets; el Worker atiende /api/* y entrega index.html en "/".
main = "worker/index.ts"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Base D1 donde se guarda la tabla `alertas_salud` (la crea el propio Worker
# la primera vez que se usa; no lee ninguna otra tabla).
[[d1_databases]]
binding = "DB"
database_name = "suministros_db"
database_id = "664ea2d3-98ae-407e-a79b-ec17294970ef"

# Dirección del sitio (enlace dentro del mail).
[vars]
SITIO_URL = "https://alarmas-de-sumis.moron-presupuesto.workers.dev"

# Aviso diario por mail: 11:00 UTC = 8:00 en Argentina.
[triggers]
crons = ["0 11 * * *"]

# Secrets del mail (no van acá): RESEND_API_KEY, MAIL_DESTINOS, y opcionales
# MAIL_FROM y CRON_TOKEN. Ver README.
